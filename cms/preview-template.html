<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Michel van Heest — Product & UX Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Newsreader:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafafa;--surface:#fff;--ink:#161616;--soft:#4a4a4a;--mute:#7a7a7a;--line:#e6e6e4;
  --accent:#44691b;--accent-ink:#fff;--tint:#f4f4f2;
  --serif:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#242424;--surface:#242424;--ink:#f1f1ee;--soft:#c4c4c0;--mute:#908f8b;--line:#353535;
  --accent:#8fba55;--accent-ink:#10160a;--tint:#2c2c2c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#242424;--surface:#242424;--ink:#f1f1ee;--soft:#c4c4c0;--mute:#908f8b;--line:#353535;--accent:#8fba55;--accent-ink:#10160a;--tint:#2c2c2c;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--serif);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 32px}
.top{background:var(--bg)}
header.bar{display:flex;align-items:center;justify-content:space-between;padding:36px 0 28px;border-bottom:1px solid var(--line)}
.who{display:flex;align-items:center;gap:14px}
.avatar{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9b48f 0 18%,transparent 19%),linear-gradient(160deg,#5c8a2c,#2f4d14);display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;flex:none}
.who b{display:block;font-size:19px;font-weight:600;line-height:1.2}
.who small{display:block;font-size:13px;color:var(--mute)}
.social{display:flex;gap:22px;align-items:center}
.social a{color:var(--soft);display:grid;place-items:center}
.social a:hover{color:var(--accent)}
svg.i{width:18px;height:18px;fill:currentColor}
.profile{display:grid;grid-template-columns:auto 1fr;gap:56px;align-items:start;padding:32px 0 64px}
.pav{position:relative;z-index:1;width:152px;height:152px;border-radius:50%;margin:-92px 5px 5px;background:radial-gradient(circle at 35% 30%,#d9b48f 0 18%,transparent 19%),linear-gradient(160deg,#5c8a2c,#2f4d14);box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:56px}
.prow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prow h1{font-size:30px;font-weight:600;letter-spacing:-.01em;margin:0 12px 0 0;line-height:1.2}
.prow .btn{display:inline-block;padding:9px 16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
.stats{display:flex;gap:32px;flex-wrap:wrap;margin:24px 0 20px;padding:0;list-style:none;font-size:16px;color:var(--soft)}
.stats b{color:var(--ink);font-weight:700}
.bio{margin:0 0 20px;max-width:34em;color:var(--soft);font-size:17px;line-height:1.6}
.bio strong{display:block;color:var(--ink);font-weight:600}
.sh{font-size:20px;font-weight:600;margin:0}
.sh button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:24px 0;background:none;border:0;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.sh button:hover{color:var(--accent)}
.chev{width:22px;height:22px;flex:none;transition:transform .2s}
.acc{border-top:1px solid var(--line)}
#v-photography{border-bottom:1px solid var(--line)}
.acc:not(.open)>:not(.sh){display:none}
.acc.open{padding-bottom:56px}
.acc.open>.sh{margin-bottom:20px}
.acc.open .chev{transform:rotate(180deg)}
.view.on.acc{margin-bottom:0}
.hero h1{font-size:clamp(40px,7.4vw,76px);line-height:1.04;font-weight:700;letter-spacing:-.025em;margin:0;max-width:11.5em}
.hero p{font-size:clamp(18px,2.2vw,24px);line-height:1.6;color:var(--soft);max-width:30em;margin:32px 0 0}
nav.tabs{display:flex;gap:32px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:16px 0 18px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
main{padding:56px 0 80px;min-height:50vh}
.view{display:none}.view.on{display:block;margin-bottom:88px}.view.on:last-child{margin-bottom:0}
@media (max-width:820px){.profile{grid-template-columns:1fr;gap:28px;padding:24px 0 44px}.pav{width:104px;height:104px;font-size:38px;margin-top:-64px}.stats{gap:22px}}
/* writing */
.post{padding:0 0 40px;margin-bottom:40px;border-bottom:1px solid var(--line)}
.post:last-child{border:0;margin:0}
.meta{font-size:12px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;display:flex;gap:12px;flex-wrap:wrap}
.meta .t{text-transform:none;letter-spacing:0}
.post h2{font-size:28px;line-height:1.25;font-weight:600;margin:10px 0 14px;letter-spacing:-.01em}
.post h2 a:hover{color:var(--accent)}
.post p{margin:0;color:var(--soft);font-size:15px;max-width:40em}
.btn{border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;padding:11px 18px;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
/* article */
.back{font-size:14px;color:var(--soft);display:inline-block;margin-bottom:28px}
.back:hover{color:var(--accent)}
.article{max-width:720px;margin:0 auto}
.cover{aspect-ratio:16/6;border-radius:10px;margin-bottom:40px;background:
 repeating-linear-gradient(0deg,transparent 0 23px,rgba(0,0,0,.05) 23px 24px),
 repeating-linear-gradient(90deg,transparent 0 23px,rgba(0,0,0,.05) 23px 24px),var(--tint);border:1px solid var(--line);position:relative;overflow:hidden}
.cover:before,.cover:after{content:"";position:absolute;border:2px solid var(--mute);border-radius:14px;opacity:.55}
.cover:before{width:16%;height:80%;left:12%;top:10%;transform:rotate(-6deg)}
.cover:after{width:22%;height:70%;left:38%;top:18%;transform:rotate(4deg)}
.article h1{font-size:clamp(32px,5vw,46px);line-height:1.15;margin:12px 0 28px;letter-spacing:-.02em}
.article h2{font-size:26px;margin:44px 0 12px;line-height:1.3;font-weight:600}
.article p{font-size:16px;color:var(--soft);margin:0 0 22px}
.article p.lead{color:var(--ink);font-weight:500}
.share{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:56px;padding-top:28px;font-size:18px;font-weight:600}
.share div{display:flex;gap:10px}
.share button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--soft);cursor:pointer;display:grid;place-items:center}
.share button:hover{color:var(--accent);border-color:var(--accent)}
/* about / projects / photography */
.about{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:72px}
.about p{font-size:19px;color:var(--soft);margin:0 0 22px;max-width:34em}
.about p:first-child{color:var(--ink)}
.facts{border-top:1px solid var(--line)}
.facts div{padding:16px 0;border-bottom:1px solid var(--line);font-size:15px}
.facts span{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px 40px}
.proj .thumb{aspect-ratio:4/3;border-radius:10px;margin-bottom:18px;border:1px solid var(--line)}
.proj h2{font-size:24px;margin:8px 0 8px;font-weight:600;letter-spacing:-.01em}
.proj p{margin:0;color:var(--soft);font-size:16px}
.proj:hover h2{color:var(--accent)}
.photos{columns:3;column-gap:16px}
.about p{font-size:16px}
.cover-img{position:relative}
.tgl{position:absolute;top:18px;right:24px;z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(20,20,20,.35);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;display:grid;place-items:center;padding:0}
.tgl:hover{background:rgba(20,20,20,.55)}
.tgl:focus-visible{outline-color:#fff}
.cover-img img{display:block;width:100%;height:clamp(170px,27vw,320px);object-fit:contain;object-position:center;background:var(--tint)}
.jobs{list-style:none;margin:0 0 28px;padding:0}
.jobs li{display:grid;grid-template-columns:160px 1fr;gap:24px;padding:24px 0;border-top:1px solid var(--line)}
.jobs li:first-child{border-top:0;padding-top:0}
.yr{color:var(--mute);font-size:14px}
.jobs h3{margin:0;font-size:18px;font-weight:600}
.jobs .co{margin:2px 0 10px;color:var(--ink);font-size:14px}
.jobs p{margin:0;color:var(--soft);font-size:15px;max-width:40em}
.skills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}
.skills span{border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--soft)}
a.btn{display:inline-block}
.ltabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.ltabs button{border:1px solid var(--line);background:var(--surface);color:var(--soft);padding:8px 18px;border-radius:999px;cursor:pointer;font-size:14px}
.ltabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lview{overflow:hidden}
.ltrack{display:flex;transition:transform .35s ease}
.list-footer{display:flex;justify-content:center;margin-top:8px}
.slide{flex:0 0 100%;min-width:0}
.row{--h:clamp(300px,42vw,380px);display:flex;gap:6px;align-items:flex-start;overflow-x:auto;padding:22px 0 30px}
.sp{flex:none;position:relative;height:var(--h);border-radius:3px 3px 2px 2px;writing-mode:vertical-rl;display:flex;align-items:center;gap:16px;padding-block-start:28px;background-color:var(--c);background-image:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.16) 30%,rgba(255,255,255,0) 55%,rgba(0,0,0,.22));transition:transform .35s cubic-bezier(.3,1.5,.5,1),box-shadow .3s}
.row>.sp:first-child{margin-left:auto}.row>.sp:last-child{margin-right:auto}
.ltabs{justify-content:center}
.sp:hover{transform:translateY(-14px);box-shadow:0 16px 20px rgba(0,0,0,.35)}
.sp small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.72;max-height:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp b{font:700 clamp(15px,1.7vw,19px)/1.1 Newsreader,Georgia,serif;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:calc(var(--h) - 140px)}
.row.has-selection{gap:14px}
.row.has-selection .sp:not(.selected){transform:translateX(var(--shift)) scale(.94)}
.row .sp.selected{z-index:2;transform:perspective(700px) rotateX(68deg) translateY(30px) scale(.94);transform-origin:center bottom;box-shadow:0 20px 24px rgba(0,0,0,.3)}
@media (max-width:820px){.jobs li{grid-template-columns:1fr;gap:6px}}
.waves{position:absolute;left:0;right:0;bottom:-1px;height:clamp(34px,5vw,64px);overflow:hidden;color:var(--bg);pointer-events:none}
.waves svg{position:absolute;left:0;bottom:0;width:200%;height:100%;fill:currentColor;animation:wv 12s linear infinite}
.waves svg:nth-child(1){opacity:.35;animation-duration:20s}
.waves svg:nth-child(2){opacity:.65;animation-duration:13s;animation-direction:reverse}
.waves svg:nth-child(3){animation-duration:9s}
@keyframes wv{to{transform:translateX(-50%)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.acc.open>:not(.sh){animation:rise .4s ease}
.btn{transition:transform .2s,box-shadow .2s,filter .2s,border-color .2s,color .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(68,105,27,.28)}
.btn:active{transform:none;box-shadow:none}
.social a{transition:transform .3s cubic-bezier(.3,1.7,.5,1),color .2s}
.social a:hover{transform:translateY(-3px) rotate(-10deg) scale(1.2)}
.pav{transition:transform .45s cubic-bezier(.3,1.7,.5,1),box-shadow .3s}
.pav:hover{transform:rotate(-8deg) scale(1.06);box-shadow:0 0 0 4px var(--bg),0 0 0 9px var(--accent)}
.stats li{transition:transform .2s}
.stats li:hover{transform:translateY(-2px)}
.stats li:hover b{color:var(--accent)}
.tgl{transition:transform .35s cubic-bezier(.3,1.7,.5,1),background .2s}
.tgl:hover{transform:rotate(30deg) scale(1.1)}
.sh button span{transition:transform .25s}
.sh button:hover span{transform:translateX(8px)}
.post h2 a{background:linear-gradient(var(--accent),var(--accent)) 0 100%/0 2px no-repeat;transition:background-size .35s,color .2s}
.post h2 a:hover{background-size:100% 2px}
.post h2,.post p{transition:transform .3s}
.post:hover h2,.post:hover p{transform:translateX(6px)}
.proj .thumb{transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.proj:hover .thumb{transform:translateY(-6px) rotate(-1deg);box-shadow:0 16px 28px rgba(0,0,0,.14)}
.photos img{transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .3s}
.photos img:hover{transform:scale(1.04) rotate(-.8deg);filter:brightness(1.06)}
.jobs li{transition:padding-left .25s}
.jobs li:hover{padding-left:10px}
.skills span{transition:transform .2s,background .2s,color .2s,border-color .2s}
.skills span:hover{transform:translateY(-2px);background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ltabs button{transition:transform .2s,border-color .2s,color .2s}
.ltabs button:hover{transform:translateY(-2px);border-color:var(--accent);color:var(--accent)}
.ltabs button[aria-selected="true"]:hover{color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){.waves svg,.acc.open>:not(.sh){animation:none!important}}
.pav img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.sp{color:var(--ink)}
.sp.im{color:#fff;background-image:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.1) 35%,rgba(0,0,0,.25)),linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),var(--im);background-size:auto,auto,contain;background-position:0 0,0 0,center;background-repeat:repeat,repeat,no-repeat;background-color:var(--tint)}
.thumb{background:var(--g);display:grid;place-items:center;overflow:hidden}
.thumb.im{background:var(--tint)}
.thumb.im img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
.photos img,.photos .ph{display:block;width:100%;border-radius:8px;margin:0 0 16px;border:1px solid var(--line)}
.photos .ph{aspect-ratio:4/3}
.empty{column-span:all;text-align:center;color:var(--mute);padding:72px 0 56px;margin:0;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:600;margin-bottom:6px}
footer{background:var(--bg);border-top:1px solid var(--line)}
footer .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:40px;padding-bottom:40px;gap:20px;flex-wrap:wrap}
footer small{color:var(--mute);font-size:12.5px}
@media (max-width:820px){
  .wrap{padding:0 22px}
  .about{grid-template-columns:1fr;gap:48px}
  .grid{grid-template-columns:1fr}
  .photos{columns:2}
  header.bar{padding-top:24px}
  .social{gap:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.skills-tools-content{padding-bottom:28px}
.tool-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tool-group{border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--surface)}
.tool-group h3{margin:0 0 14px;color:var(--soft);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tool-icons{display:grid;grid-template-columns:repeat(6,48px);gap:10px;align-items:center}
.tool-icons img{display:block;width:48px;height:48px;object-fit:contain}
@media(max-width:820px){.tool-groups{grid-template-columns:1fr}}
@media(max-width:420px){.tool-icons{grid-template-columns:repeat(3,48px)}}
</style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracklist - Nilanjan Singha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Newsreader:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./main/styles.css">
<style>
.tracklist-page{min-height:100vh;background:var(--bg);color:var(--ink)}
.tracklist-header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-top:38px;padding-bottom:28px}
.tracklist-header h1{margin:0;font-size:clamp(34px,6vw,64px);line-height:.95}
.tracklist-header a{color:var(--soft);text-decoration:none;font-size:14px}
.tracklist-toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.tracklist-filters,.tracklist-status-filters{display:flex;flex-wrap:wrap;gap:8px}
.tracklist-status-filters{margin-top:18px}
.tracklist-toolbar button,.tracklist-toolbar input{font:500 13px var(--serif);border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--soft);padding:9px 14px}
.tracklist-status-filters button{font:500 13px var(--serif);border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--soft);padding:9px 14px;cursor:pointer}
.tracklist-toolbar button,.tracklist-status-filters button{cursor:pointer}
.tracklist-toolbar button.active,.tracklist-status-filters button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tracklist-toolbar input{border-radius:8px;min-width:min(260px,100%)}
.tracklist-stats{display:flex;gap:8px;color:var(--mute);font-size:12px;margin-top:18px;margin-bottom:18px}
.tracklist-stats span{border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:7px 11px}
.tracklist-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;padding-bottom:64px}
.track-card{min-width:0}
.track-poster{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--c);box-shadow:0 12px 26px rgba(0,0,0,.12);transition:transform .25s,box-shadow .25s}
.track-card:hover .track-poster{transform:translateY(-5px);box-shadow:0 18px 34px rgba(0,0,0,.18)}
.track-poster img{width:100%;height:100%;object-fit:cover;display:block}
.track-status-tag{position:absolute;left:10px;bottom:10px;border:0;border-radius:999px;background:rgba(20,20,20,.78);color:#fff;padding:6px 9px;font:500 11px var(--serif);z-index:2;backdrop-filter:blur(8px);cursor:pointer}
.track-poster-fallback{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(0,0,0,.38))}
.track-poster-fallback b{font:700 clamp(18px,2vw,28px)/1 Newsreader,Georgia,serif;color:inherit;text-transform:uppercase}
.track-poster-fallback small{margin-top:8px;color:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.12em}
.track-meta{padding-top:12px}
.track-meta h2{margin:0 0 3px;font-size:16px;line-height:1.25}
.track-meta p{margin:0 0 10px;color:var(--mute);font-size:12px}
.track-empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:10px;padding:32px;text-align:center;color:var(--mute)}
@media(max-width:820px){.tracklist-header{align-items:flex-start}.tracklist-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.tracklist-toolbar{align-items:flex-start}.tracklist-toolbar input{width:100%}}
</style>
</head>
<body>
<main class="tracklist-page">
 <div class="wrap">
  <header class="tracklist-header">
   <h1>Tracklist</h1>
   <a href="./index.html">← Back to portfolio</a>
  </header>
  <div class="tracklist-toolbar">
   <div class="tracklist-filters" id="category-filters" aria-label="List categories"></div>
   <input id="track-search" type="search" placeholder="Search title or name" aria-label="Search tracklist">
  </div>
  <div class="tracklist-status-filters" id="status-filters" aria-label="Status filters"></div>
  <div class="tracklist-stats" id="tracklist-stats"></div>
  <div class="tracklist-grid" id="tracklist-grid"></div>
 </div>
</main>
<script type="module" src="./tracklist.js"></script>
</body>
</html>
